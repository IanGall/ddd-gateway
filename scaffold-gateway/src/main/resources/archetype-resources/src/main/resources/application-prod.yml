#set( $symbol_dollar = '$' )
dubbo:
  registry:
    address: ${symbol_dollar}{DUBBO_REGISTRY_ADDRESS}
    username: ${symbol_dollar}{DUBBO_REGISTRY_USERNAME}
    password: ${symbol_dollar}{DUBBO_REGISTRY_PASSWORD}
    use-as-config-center: false
    use-as-metadata-center: false

gateway:
  security:
    admin:
      username: ${symbol_dollar}{GATEWAY_ADMIN_USERNAME}
      password: ${symbol_dollar}{GATEWAY_ADMIN_PASSWORD}
