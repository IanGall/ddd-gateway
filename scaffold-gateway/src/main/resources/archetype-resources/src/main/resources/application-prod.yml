#set( $symbol_dollar = '$' )
spring:
  data:
    redis:
      host: ${symbol_dollar}{REDIS_HOST}
      port: ${symbol_dollar}{REDIS_PORT:6379}
      password: ${symbol_dollar}{REDIS_PASSWORD:}

dubbo:
  consumer:
    parameters:
      ssl-enabled: false
  registry:
    address: ${symbol_dollar}{DUBBO_REGISTRY_ADDRESS}
    username: ${symbol_dollar}{DUBBO_REGISTRY_USERNAME}
    password: ${symbol_dollar}{DUBBO_REGISTRY_PASSWORD}
    use-as-config-center: false
    use-as-metadata-center: false

gateway:
  security:
    platform:
      token: ${symbol_dollar}{PLATFORM_ADMIN_TOKEN}
