dubbo:
  consumer:
    parameters:
      ssl-enabled: false
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS}
    username: ${DUBBO_REGISTRY_USERNAME}
    password: ${DUBBO_REGISTRY_PASSWORD}
    use-as-config-center: false
    use-as-metadata-center: false

oauth2:
  client:
    id: ${OAUTH2_CLIENT_ID}
    secret: ${OAUTH2_CLIENT_SECRET}
  internal-token: ${OAUTH2_INTERNAL_TOKEN:${OAUTH2_CLIENT_SECRET}}
