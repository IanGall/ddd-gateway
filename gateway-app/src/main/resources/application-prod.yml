dubbo:
  consumer:
    parameters:
      ssl-enabled: false
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS}
    username: ${DUBBO_REGISTRY_USERNAME}
    password: ${DUBBO_REGISTRY_PASSWORD}
    use-as-config-center: false
    use-as-metadata-center: false

gateway:
  security:
    session:
      redis-enabled: true
      redis:
        address: ${AUTH_REDIS_ADDRESS}
        password: ${AUTH_REDIS_PASSWORD:}
        database: ${AUTH_REDIS_DATABASE:0}
    platform:
      token: ${PLATFORM_ADMIN_TOKEN}
