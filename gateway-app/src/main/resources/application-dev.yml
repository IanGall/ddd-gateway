dubbo:
  consumer:
    parameters:
      ssl-enabled: false
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848}
    username: ${DUBBO_REGISTRY_USERNAME:nacos}
    password: ${DUBBO_REGISTRY_PASSWORD:Ian2026OpsPwd}
    use-as-config-center: false
    use-as-metadata-center: false

gateway:
  security:
    session:
      # 开发环境使用 Redis 共享会话，启动前必须保证 Redis 可连接。
      redis-enabled: ${AUTH_REDIS_ENABLED:true}
    platform:
      token: ${PLATFORM_ADMIN_TOKEN:dev-platform-token-change-me}
